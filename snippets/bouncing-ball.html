     Paste this whole block where you want the graphic (it fills its container).

     Each dash appears only once the ball has passed over it, so the trail is laid
     down behind the ball. Nothing masks or clips the arc.

     Degrades safely, in this order:
       styles + script kept  → runs when scrolled into view
       script stripped       → runs on page load instead

     If your builder strips style and script tags, use snippets/bouncing-ball.svg
     instead — same animation, self-contained inside the SVG.

     The dash geometry and per-dash timings are generated alongside the ball's motion
     by snippets/tools/bounce-dashes.mjs. Retiming the ball by hand puts the trail out
     of step; change that script and re-run it instead.

     fill attributes in the markup are the no-CSS fallback, so keep them in step.
     ============================================================ -->

<style>
  .bounce-arc {
    --bx-color: #4f4f4f;
    --bx-speed: 2.4s;
    --bx-max-width: 900px;
    display: block;
    width: 100%;
    max-width: var(--bx-max-width);
    margin: 0 auto;
    line-height: 0;
  }
  .bounce-arc svg { width: 100%; height: auto; overflow: visible; }
  .bounce-arc .bx-trail { stroke: var(--bx-color, #4f4f4f); }
  .bounce-arc circle { fill: var(--bx-color, #4f4f4f); }

  /* Every dash carries its own --bx-at: how far through the run the ball has passed it,
     as a fraction, so the trail rescales with --bx-speed. The 1ms duration makes a dash
     appear rather than fade, which is what a dropped trail does. */
  .bounce-arc .bx-dash {
    animation: bx-appear 1ms linear calc(var(--bx-at) * var(--bx-speed)) both;
  }
  .bounce-arc .bx-ball {
    offset-path: path("M -1785 170 Q -1603 -96, -1420 168 Q -837 -592, -253 168 Q -155 16, 0 0");
    offset-rotate: 0deg;
    animation: bx-travel var(--bx-speed) both;
  }
  .bounce-arc .bx-squash,
  .bounce-arc .bx-bob { transform-box: fill-box; transform-origin: 50% 50%; }
  .bounce-arc .bx-squash { animation: bx-squash var(--bx-speed) both; }
  .bounce-arc .bx-bob { animation: bx-bob 3s ease-in-out calc(var(--bx-speed) + 0.3s) infinite; }

  /* The optional script adds data-bx-wait so nothing starts until the graphic is
     scrolled into view. No script means no attribute, and it runs on load. Paused
     animations hold their first keyframe, which is why the trail stays hidden. */
  .bounce-arc[data-bx-wait] .bx-dash,
  .bounce-arc[data-bx-wait] .bx-ball,
  .bounce-arc[data-bx-wait] .bx-squash,
  .bounce-arc[data-bx-wait] .bx-bob {
    animation-play-state: paused;
  }

  @keyframes bx-appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes bx-travel {
    0%     { offset-distance: 0%;     animation-timing-function: cubic-bezier(.15,.55,.35,1); }
    12.5%  { offset-distance: 10.53%; animation-timing-function: cubic-bezier(.65,0,.85,.45); }
    25%    { offset-distance: 21.05%; animation-timing-function: cubic-bezier(.15,.55,.35,1); }
    51.04% { offset-distance: 53.45%; animation-timing-function: cubic-bezier(.65,0,.85,.45); }
    77.08% { offset-distance: 85.85%; animation-timing-function: cubic-bezier(.15,.55,.35,1); }
    88.54% { offset-distance: 92.93%; animation-timing-function: cubic-bezier(.15,.55,.35,1); }
    100%   { offset-distance: 100%; }
  }
  /* Squash on each impact: 25% and 77.08% of the run are the two bounces. */
  @keyframes bx-squash {
    0%, 22.5%, 29%, 74.5%, 81%, 100% { transform: scale(1, 1); }
    25%, 77.08%                      { transform: scale(1.28, 0.74); }
  }
  @keyframes bx-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bounce-arc .bx-dash,
    .bounce-arc .bx-ball,
    .bounce-arc .bx-squash,
    .bounce-arc .bx-bob { animation: none !important; }
    /* Straight to the finished graphic. */
    .bounce-arc .bx-dash { opacity: 1; }
    .bounce-arc .bx-ball { offset-distance: 100%; }
  }
</style>

<script>
  /* Enhancement only: holds the run until the graphic scrolls into view.
     Delete this block and it animates on page load instead. */
  (function () {
    function init() {
      var items = document.querySelectorAll('.bounce-arc:not([data-bx-ready])');
      if (!items.length || !('IntersectionObserver' in window)) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.removeAttribute('data-bx-wait');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.35 });

      Array.prototype.forEach.call(items, function (el) {
        el.setAttribute('data-bx-ready', '');
        /* Only hold what is still below the fold — something already on screen should
           run rather than wait for a scroll that never comes. */
        if (el.getBoundingClientRect().top > window.innerHeight * 0.9) {
          el.setAttribute('data-bx-wait', '');
        }
        observer.observe(el);
      });
    }

    init();
    document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('load', init);
  })();
</script>
