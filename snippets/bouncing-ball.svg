     role="img" aria-label="A ball bouncing along an arc, leaving a dashed trail behind it">
  <title>Bouncing ball leaving a dashed trail</title>
  <!--
    Self-contained: the animation is SMIL, inside the SVG, so it needs no CSS and no
    JavaScript and survives page builders that strip style and script tags.

    Each dash is its own element that appears only once the ball has passed over it, so
    the trail is laid down behind the ball. Nothing masks or clips the arc — an earlier
    version swept a mask along it, which is fragile: some renderers and sanitisers drop
    the mask, and then the whole arc shows at once with the ball running over it.

    The dash geometry and the reveal times are generated together with the ball's motion
    by snippets/tools/bounce-dashes.mjs. Retiming the ball by hand will put the trail out
    of step — change the values in that script and re-run it instead.

    Colour: change the two #4f4f4f values.  Ball size: the circle's r.
    If SMIL is ever ignored, the finished graphic shows: the full dashed arc with the
    ball resting at the top right.
  -->
  <defs>
    <path id="ba-path" fill="none"
          d="M -1785 170 Q -1603 -96, -1420 168 Q -837 -592, -253 168 Q -155 16, 0 0" />
  </defs>

