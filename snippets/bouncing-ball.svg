  <!-- The origin (0,0) is the ball's landing point, deliberately: animateMotion is
       post-multiplied onto the transform attribute rather than replacing it, so a ball
       positioned by a transform ends up doubly offset. With the origin here the ball
       needs no transform of its own. -->
  <g>
    <animateMotion begin="0s" dur="2.4s" fill="freeze" rotate="0" calcMode="spline"
                   keyPoints="0; 0.1053; 0.2105; 0.5345; 0.8585; 0.9293; 1"
                   keyTimes="0; 0.125; 0.25; 0.5104; 0.7708; 0.8854; 1"
                   keySplines="0.15 0.55 0.35 1;
                               0.65 0 0.85 0.45;
                               0.15 0.55 0.35 1;
                               0.65 0 0.85 0.45;
                               0.15 0.55 0.35 1;
                               0.15 0.55 0.35 1">
      <mpath xlink:href="#ba-path" href="#ba-path" />
    </animateMotion>

    <!-- One transform per nesting level: motion above, then the resting hover, then the
         squash on impact. Stacked on one element they would fight. -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -7; 0 0" keyTimes="0; 0.5; 1"
                        dur="3s" begin="2.7s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 1.28 0.74; 1 1" keyTimes="0; 0.3; 1"
                          dur="0.24s" begin="0.54s; 1.79s" fill="remove" />
        <circle r="21" fill="#4f4f4f" />
      </g>
    </g>
