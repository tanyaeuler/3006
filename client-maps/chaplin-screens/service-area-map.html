<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  .csm {
    --csm-blue: #1d3970;
    --csm-yellow: #ffdc00;
    --csm-ink: #14284f;
    --csm-muted: #5b6b8c;
    position: relative;
    width: 100%;
    font-family: inherit;
    color: var(--csm-ink);
  }
  .csm *, .csm *::before, .csm *::after { box-sizing: border-box; }

  /* ---- Map ---- */
  .csm-stage { position: relative; }
  .csm-map {
    width: 100%;
    height: clamp(340px, 58vw, 600px);
    border-radius: 14px;
    overflow: hidden;
    background: #eef1f4;
    font: inherit;
    /* The map is fixed in place, so every gesture belongs to the page:
       no scroll trap on trackpads, mice or phones. */
    touch-action: auto !important;
    cursor: default;
  }
  .csm .leaflet-control-attribution { font-size: 10px; background: rgba(255, 255, 255, .7); }

  /* ---- Markers ---- */
  .csm-marker { width: 0; height: 0; overflow: visible; }
  .csm-pinwrap {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .csm-pin {
    display: block;
    width: 30px; height: 40px;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
  }
  .csm-pin svg { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .csm-shadow {
    position: absolute;
    left: 50%; top: 100%;
    width: 14px; height: 4px;
    margin: -2px 0 0 -7px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .22);
    pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }

  /* Suburbs without a page yet: a quiet dot, name in the hover card. */
  .csm-dotwrap { transform: translate(-50%, -50%); padding: 8px; }
  .csm-dot {
    display: block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--csm-blue);
    border: 2px solid #ffffff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: transform .2s ease, background-color .2s ease;
  }

  .csm-label {
    position: absolute;
    white-space: nowrap;
    padding: 1px 5px;
    border-radius: 5px;
    color: var(--csm-ink);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 6px #fff;
    transition: opacity .2s ease, background-color .15s ease, color .15s ease;
  }
  /* Label sits below, right, left or above its pin, whichever is clear. */
  .csm-label.at-b { top: calc(100% + 3px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-t { bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-r { left: calc(100% + 2px); top: 38%; transform: translateY(-50%); }
  .csm-label.at-l { right: calc(100% + 2px); top: 38%; transform: translateY(-50%); }
  .csm-label.is-hidden { opacity: 0; }

  /* Dot labels: smaller, centred under the dot (or above if blocked). */
  .csm-dotwrap .csm-label { font-size: 11px; font-weight: 600; padding: 1px 4px; }
  .csm-dotwrap .csm-label.at-b,
  .csm-dotwrap .csm-label.at-br,
  .csm-dotwrap .csm-label.at-bl { top: calc(100% - 6px); left: 50%; }
  .csm-dotwrap .csm-label.at-t,
  .csm-dotwrap .csm-label.at-tr,
  .csm-dotwrap .csm-label.at-tl { bottom: calc(100% - 6px); left: 50%; }
  /* Still under (or over) the dot, just nudged sideways to clear a neighbour. */
  .csm-dotwrap .csm-label.at-br, .csm-dotwrap .csm-label.at-tr { transform: translateX(-22%); }
  .csm-dotwrap .csm-label.at-bl, .csm-dotwrap .csm-label.at-tl { transform: translateX(-78%); }

  /* Home base: the Chaplin bowler hat, centred on the spot (no pin tip). */
  .csm-hq { transform: translate(-50%, -55%); }
  .csm-hq .csm-pin {
    width: 72px; height: 63px;
    filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 3px 3px rgba(0, 0, 0, .28));
  }
  .csm-hq .csm-shadow { width: 30px; margin-left: -15px; margin-top: -4px; }
  .csm-hq:focus-visible { outline: 2px solid var(--csm-blue); outline-offset: 3px; border-radius: 8px; }

  /* ---- Hot state (pin or dot hovered/focused) ---- */
  .csm-pinwrap.is-hot .csm-pin svg { animation: csm-hop .55s cubic-bezier(.3, 0, .3, 1) forwards; }
  .csm-pinwrap.is-hot .csm-shadow { transform: scale(.7); opacity: .6; }
  .csm-pinwrap.is-hot .csm-label {
    opacity: 1;
    background: var(--csm-blue);
    color: var(--csm-yellow);
    text-shadow: none;
  }
  .csm-pinwrap.is-hot .csm-dot { transform: scale(1.45); background: var(--csm-yellow); border-color: var(--csm-blue); }
  .csm-pinwrap:focus-visible .csm-pin svg path:first-of-type { stroke: var(--csm-yellow); stroke-width: 3; }
  .csm-pinwrap:focus-visible .csm-dot { outline: 2px solid var(--csm-blue); outline-offset: 2px; }
  /* One hop, then hold slightly raised while hot. */
  @keyframes csm-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    18%  { transform: translateY(0) scale(1.08, .9); }
    50%  { transform: translateY(-14px) scale(.96, 1.05); }
    75%  { transform: translateY(-3px) scale(1.03, .97); }
    100% { transform: translateY(-6px) scale(1, 1); }
  }

  /* ---- Arrival: pins drop in once, rippling out from the home base ---- */
  .csm.is-pending .csm-pin,
  .csm.is-pending .csm-dot,
  .csm.is-pending .csm-label,
  .csm.is-pending .csm-shadow { opacity: 0; }
  .csm.is-live .csm-pin  { animation: csm-drop .55s cubic-bezier(.3, 1.5, .55, 1) backwards; animation-delay: var(--d, 0s); }
  .csm.is-live .csm-dot  { animation: csm-pop .4s cubic-bezier(.3, 1.6, .55, 1) backwards; animation-delay: var(--d, 0s); }
  .csm.is-live .csm-label,
  .csm.is-live .csm-shadow { animation: csm-fade .3s ease backwards; animation-delay: calc(var(--d, 0s) + .3s); }
  @keyframes csm-drop { from { opacity: 0; transform: translateY(-36px); } 60% { opacity: 1; } }
  @keyframes csm-pop  { from { opacity: 0; transform: scale(0); } }
  @keyframes csm-fade { from { opacity: 0; } }

  /* ---- Hover card ---- */
  .csm-card {
    position: absolute;
    left: 0; top: 0;
    z-index: 1000;
    min-width: 150px;
    max-width: 240px;
    padding: 10px 14px 11px;
    border-radius: 10px;
    border-top: 3px solid var(--csm-yellow);
    background: #ffffff;
    box-shadow: 0 8px 24px rgba(20, 40, 79, .18), 0 1px 3px rgba(20, 40, 79, .12);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .16s ease, transform .16s ease;
  }
  .csm-card.is-on { opacity: 1; transform: translateY(0); }
  .csm-card::after {
    content: "";
    position: absolute;
    left: var(--nub, 50%);
    bottom: -6px;
    width: 12px; height: 12px;
    margin-left: -6px;
    background: #ffffff;
    transform: rotate(45deg);
    box-shadow: 3px 3px 4px rgba(20, 40, 79, .08);
  }
  .csm-card.is-below::after { bottom: auto; top: -8px; box-shadow: none; background: var(--csm-yellow); }
  .csm-card-eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--csm-muted);
  }
  .csm-card-name { display: block; margin-top: 1px; font-size: 16px; font-weight: 800; color: var(--csm-blue); }
  .csm-card-cta {
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--csm-blue);
    box-shadow: inset 0 -3px 0 var(--csm-yellow);
  }
  .csm-card-note { display: block; margin-top: 4px; font-size: 13px; color: var(--csm-muted); }


  @media (max-width: 600px) {
    .csm-map { border-radius: 10px; }
    .csm-label { font-size: 12px; }
    .csm-pin { width: 26px; height: 35px; }
    .csm-hq .csm-pin { width: 48px; height: 42px; }
  }
  @media (max-width: 400px) {
    .csm-dotwrap .csm-label { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .csm *, .csm *::before, .csm *::after { animation: none !important; transition: none !important; }
  }
</style>

  function hatSvg() {
    return '<svg viewBox="20 20 160 141" aria-hidden="true" focusable="false">' +
      '<path fill="#000" fill-rule="evenodd" d="' + HAT_PATH + '"/></svg>';
  }

  function pinSvg(fill, stroke, dot) {
    return '<svg viewBox="0 0 30 40" aria-hidden="true" focusable="false">' +
      '<path d="M15 1.5C7.5 1.5 1.5 7.4 1.5 14.8c0 9.6 11.2 21.6 12.6 23.1a1.3 1.3 0 0 0 1.8 0c1.4-1.5 12.6-13.5 12.6-23.1C28.5 7.4 22.5 1.5 15 1.5z" ' +
      'fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<circle cx="15" cy="14.5" r="5.2" fill="' + dot + '"/></svg>';
  }

  var entries = [];
  var lastPointerWasTouch = false;
  root.addEventListener('pointerdown', function (e) { lastPointerWasTouch = e.pointerType === 'touch'; }, true);

  function addMarker(item, kind) {
    var url = safeUrl(item.url);
    var hq = kind === 'hq';
    var full = hq || !!url;
    var tag = url ? 'a' : 'span';
    var attrs = url
      ? ' href="' + escapeHtml(url) + '" target="_top" aria-label="' + escapeHtml(item.name) + ' security screens"'
      : (hq ? ' tabindex="0" role="img" aria-label="' + escapeHtml(item.name) + ' home base"' : ' aria-hidden="true"');
    var inner = hq
      ? '<span class="csm-pin">' + hatSvg() + '</span><span class="csm-shadow"></span>'
      : full
      ? '<span class="csm-pin">' + pinSvg(BLUE, '#ffffff', YELLOW) + '</span>' +
        '<span class="csm-shadow"></span>' +
        '<span class="csm-label at-b">' + escapeHtml(item.name) + '</span>'
      : '<span class="csm-dot"></span>' +
        '<span class="csm-label at-b">' + escapeHtml(item.name) + '</span>';
    var html = '<' + tag + ' class="csm-pinwrap' + (hq ? ' csm-hq' : '') + (full ? '' : ' csm-dotwrap') + '"' + attrs + '>' +
      inner + '</' + tag + '>';

    var baseZ = hq ? 600 : (url ? 300 : 0);
    var marker = L.marker([item.lat, item.lng], {
      icon: L.divIcon({ className: 'csm-marker', html: html, iconSize: null }),
      interactive: false,  // the element inside handles events natively
      keyboard: false,
      zIndexOffset: baseZ
    }).addTo(map);

    var wrap = marker.getElement().querySelector('.csm-pinwrap');
    var entry = {
      item: item, kind: kind, url: url, marker: marker, wrap: wrap,
      label: wrap.querySelector('.csm-label'),
      priority: hq ? 0 : (url ? 1 : 2),
      baseZ: baseZ
    };
    entries.push(entry);

    wrap.addEventListener('mouseenter', function () { if (!lastPointerWasTouch) setHot(entry, true); });
    wrap.addEventListener('mouseleave', function () { setHot(entry, false); });
    wrap.addEventListener('focus', function () { setHot(entry, true); });
    wrap.addEventListener('blur', function () { setHot(entry, false); });
    wrap.addEventListener('click', function (e) {
      if (!url) { flash(entry); return; }
      // Touch has no hover: show the card and hop, then go.
      if (!lastPointerWasTouch || reduceMotion || e.button !== 0) return;
      e.preventDefault();
      setHot(entry, true);
      setTimeout(function () { (window.top || window).location.href = url; }, 420);
    });
    return entry;
  }

  mapEl.setAttribute('aria-label', 'Map of the Chaplin Screens service area, covering ' +
    SUBURBS.map(function (s) { return s.name; }).join(', '));

  addMarker(HEAD_OFFICE, 'hq');
  SUBURBS.forEach(function (s) { addMarker(s, 'suburb'); });

  /* ---- Hot state: one place drives the marker and its card ---- */
  var hotEntry = null;
  var flashTimer;
  function setHot(entry, on) {
    if (on && hotEntry && hotEntry !== entry) setHot(hotEntry, false);
    entry.wrap.classList.toggle('is-hot', on);
    entry.marker.setZIndexOffset(on ? 3000 : entry.baseZ);
    if (on) { hotEntry = entry; showCard(entry); }
    else if (hotEntry === entry) { hotEntry = null; cardEl.classList.remove('is-on'); }
  }
  function flash(entry) {
    setHot(entry, true);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { setHot(entry, false); }, 2600);
  }

  function showCard(entry) {
    var item = entry.item;
    var body;
    if (entry.kind === 'hq') {
      body = '<span class="csm-card-eyebrow">Home base</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             (item.note ? '<span class="csm-card-note">' + escapeHtml(item.note) + '</span>' : '');
    } else if (entry.url) {
      body = '<span class="csm-card-eyebrow">Security screens</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             '<span class="csm-card-cta">View ' + escapeHtml(item.name) + ' &rarr;</span>';
    } else {
      body = '<span class="csm-card-eyebrow">We service</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             '<span class="csm-card-note">and surrounding suburbs</span>';
    }
    cardEl.innerHTML = body;
    cardEl.classList.remove('is-below');
    cardEl.classList.add('is-on');

    var isDot = entry.wrap.classList.contains('csm-dotwrap');
    var pt = map.latLngToContainerPoint([item.lat, item.lng]);
    var stageW = mapEl.clientWidth;
    var w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    var pinH = isDot ? 0 : entry.wrap.querySelector('.csm-pin').offsetHeight;
    // Pins stand on the point; the hat is centred on it.
    var markHeight = isDot ? 10 : (entry.kind === 'hq' ? pinH * 0.55 + 4 : pinH + 8);
    var x = Math.max(8, Math.min(pt.x - w / 2, stageW - w - 8));
    var y = pt.y - markHeight - h - 10;
    if (y < 8) {
      // Not enough room above: open below the marker instead.
      y = pt.y + (isDot ? 14 : 30);
      cardEl.classList.add('is-below');
    }
    cardEl.style.left = x + 'px';
    cardEl.style.top = y + 'px';
    cardEl.style.setProperty('--nub', Math.max(14, Math.min(pt.x - x, w - 14)) + 'px');
  }

  /* ---- Label placement ----
     Suburb pin labels try below, right, left, then above. Dot labels go
     under the dot (centred, then nudged right or left), and only above it
     if every spot below is blocked. Each label takes
     the first spot clear of other markers, labels and the map edge.
     If none is clear it hides until its marker is hovered or tapped. */
  var SPOTS = ['at-b', 'at-r', 'at-l', 'at-t'];
  var DOT_SPOTS = ['at-b', 'at-br', 'at-bl', 'at-t', 'at-tr', 'at-tl'];
  var ALL_SPOTS = SPOTS.concat(DOT_SPOTS);
  function overlaps(a, b, pad) {
    return !(a.right + pad <= b.left || b.right + pad <= a.left || a.bottom + pad <= b.top || b.bottom + pad <= a.top);
  }
  function layoutInOrder(order) {
    var frame = mapEl.getBoundingClientRect();
    var shown = 0;
    // Marker boxes (not the animated pin) so this works mid-animation.
    var taken = entries.map(function (e) { return { r: e.wrap.getBoundingClientRect(), owner: e }; });
    function fits(r, owner) {
      return r.left >= frame.left + 2 && r.right <= frame.right - 2 &&
             r.top >= frame.top + 2 && r.bottom <= frame.bottom - 16 &&
             !taken.some(function (t) { return t.owner !== owner && overlaps(r, t.r, 2); });
    }
    order.forEach(function (e) {
        var spots = e.wrap.classList.contains('csm-dotwrap') ? DOT_SPOTS : SPOTS;
        var placed = null;
        for (var i = 0; i < spots.length && !placed; i++) {
          ALL_SPOTS.forEach(function (c) { e.label.classList.remove(c); });
          e.label.classList.add(spots[i]);
          var r = e.label.getBoundingClientRect();
          if (fits(r, e)) placed = r;
        }
        if (!placed) {
          ALL_SPOTS.forEach(function (c) { e.label.classList.remove(c); });
          e.label.classList.add(spots[0]);
        }
        e.label.classList.toggle('is-hidden', !placed);
        if (placed) { taken.push({ r: placed, owner: null }); shown++; }
      });
    return shown;
  }
  // Which label claims a spot first decides who gets squeezed out, so try
  // a few orders (linked pins always first) and keep the one that shows
  // the most names. Ties go to the earlier order.
  function placeLabels() {
    var labelled = entries.filter(function (e) { return e.label; });
    function by(fn) {
      return labelled.slice().sort(function (a, b) { return (a.priority - b.priority) || fn(a, b); });
    }
    var orders = [
      by(function () { return 0; }),
      by(function (a, b) { return b.item.lat - a.item.lat; }),   // north first
      by(function (a, b) { return a.item.lat - b.item.lat; }),   // south first
      by(function (a, b) { return a.item.lng - b.item.lng; }),   // west first
      by(function (a, b) { return b.item.lng - a.item.lng; })    // east first
    ];
    var best = 0, bestShown = -1;
    orders.forEach(function (order, i) {
      var shown = layoutInOrder(order);
      if (shown > bestShown) { best = i; bestShown = shown; }
    });
    if (best !== orders.length - 1) layoutInOrder(orders[best]);
  }
  placeLabels();


  /* ---- Arrival animation: once, when the map scrolls into view ---- */
  if (!reduceMotion && 'IntersectionObserver' in window) {
    var hqLatLng = L.latLng(HEAD_OFFICE.lat, HEAD_OFFICE.lng);
    entries
      .slice()
      .sort(function (a, b) {
        return hqLatLng.distanceTo([a.item.lat, a.item.lng]) - hqLatLng.distanceTo([b.item.lat, b.item.lng]);
      })
      .forEach(function (e, i) { e.wrap.style.setProperty('--d', (i === 0 ? 0 : 0.2 + i * 0.07) + 's'); });
    root.classList.add('is-pending');
    var io = new IntersectionObserver(function (seen) {
      if (!seen[0].isIntersecting) return;
      io.disconnect();
      root.classList.remove('is-pending');
      root.classList.add('is-live');
    }, { threshold: 0.35 });
    io.observe(mapEl);
  }

  /* ---- Keep the framing right when the layout changes ---- */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (hotEntry) setHot(hotEntry, false);
      map.invalidateSize({ animate: false });
      fitView();
      placeLabels();
    }, 150);
  });
})();
