<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaplin Screens Service Area</title>
<style>
  /* Standalone / iframe page only. Not needed when pasting the embed block. */
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
</style>
</head>
<body>

<!-- ================= CHAPLIN SCREENS MAP: EMBED START ================= -->
<!--
  To embed in WordPress: paste everything between EMBED START and EMBED END
  into a Custom HTML block. Or host this file and load it in an <iframe>.
  Links use target="_top", so they open in the full window either way.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  .csm {
    --csm-blue: #1d3970;
    --csm-yellow: #ffdc00;
    --csm-ink: #14284f;
    --csm-muted: #5b6b8c;
    position: relative;
    width: 100%;
    font-family: inherit;
    color: var(--csm-ink);
  }
  .csm *, .csm *::before, .csm *::after { box-sizing: border-box; }

  /* ---- Map ---- */
  .csm-stage { position: relative; }
  .csm-map {
    width: 100%;
    height: clamp(340px, 58vw, 600px);
    border-radius: 14px;
    overflow: hidden;
    background: #eef1f4;
    font: inherit;
    /* The map is fixed in place, so every gesture belongs to the page:
       no scroll trap on trackpads, mice or phones. */
    touch-action: auto !important;
    cursor: default;
  }
  .csm .leaflet-control-attribution { font-size: 10px; background: rgba(255, 255, 255, .7); }

  /* ---- Markers ---- */
  .csm-marker { width: 0; height: 0; overflow: visible; }
  .csm-pinwrap {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .csm-pin {
    display: block;
    width: 30px; height: 40px;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
  }
  .csm-pin svg { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .csm-shadow {
    position: absolute;
    left: 50%; top: 100%;
    width: 14px; height: 4px;
    margin: -2px 0 0 -7px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .22);
    pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }

  /* Suburbs without a page yet: a quiet dot, name in the hover card. */
  .csm-dotwrap { transform: translate(-50%, -50%); padding: 8px; }
  .csm-dot {
    display: block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--csm-blue);
    border: 2px solid #ffffff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: transform .2s ease, background-color .2s ease;
  }

  .csm-label {
    position: absolute;
    white-space: nowrap;
    padding: 1px 5px;
    border-radius: 5px;
    color: var(--csm-ink);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 6px #fff;
    transition: opacity .2s ease, background-color .15s ease, color .15s ease;
  }
  /* Label sits below, right, left or above its pin, whichever is clear. */
  .csm-label.at-b { top: calc(100% + 3px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-t { bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-r { left: calc(100% + 2px); top: 38%; transform: translateY(-50%); }
  .csm-label.at-l { right: calc(100% + 2px); top: 38%; transform: translateY(-50%); }
  .csm-label.is-hidden { opacity: 0; }

  /* Dot labels: smaller, centred under the dot (or above if blocked). */
  .csm-dotwrap .csm-label { font-size: 11px; font-weight: 600; padding: 1px 4px; }
  .csm-dotwrap .csm-label.at-b { top: calc(100% - 6px); }
  .csm-dotwrap .csm-label.at-t { bottom: calc(100% - 6px); }

  .csm-hq .csm-pin { width: 42px; height: 56px; }
  .csm-hq .csm-label {
    --csm-hat-cut: var(--csm-yellow);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    background: var(--csm-yellow);
    color: var(--csm-blue);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-shadow: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
  }

  .csm-hat { width: 1.55em; height: 1.24em; flex: none; margin: -2px 0 -1px; }
  .csm-hq.is-hot .csm-label { --csm-hat-cut: var(--csm-blue); }

  /* ---- Hot state (pin or dot hovered/focused) ---- */
  .csm-pinwrap.is-hot .csm-pin svg { animation: csm-hop .55s cubic-bezier(.3, 0, .3, 1) forwards; }
  .csm-pinwrap.is-hot .csm-shadow { transform: scale(.7); opacity: .6; }
  .csm-pinwrap.is-hot .csm-label {
    opacity: 1;
    background: var(--csm-blue);
    color: var(--csm-yellow);
    text-shadow: none;
  }
  .csm-pinwrap.is-hot .csm-dot { transform: scale(1.45); background: var(--csm-yellow); border-color: var(--csm-blue); }
  .csm-pinwrap:focus-visible .csm-pin svg path:first-of-type { stroke: var(--csm-yellow); stroke-width: 3; }
  .csm-pinwrap:focus-visible .csm-dot { outline: 2px solid var(--csm-blue); outline-offset: 2px; }
  /* One hop, then hold slightly raised while hot. */
  @keyframes csm-hop {
    0%   { transform: translateY(0) scale(1, 1); }
    18%  { transform: translateY(0) scale(1.08, .9); }
    50%  { transform: translateY(-14px) scale(.96, 1.05); }
    75%  { transform: translateY(-3px) scale(1.03, .97); }
    100% { transform: translateY(-6px) scale(1, 1); }
  }

  /* ---- Arrival: pins drop in once, rippling out from head office ---- */
  .csm.is-pending .csm-pin,
  .csm.is-pending .csm-dot,
  .csm.is-pending .csm-label,
  .csm.is-pending .csm-shadow { opacity: 0; }
  .csm.is-live .csm-pin  { animation: csm-drop .55s cubic-bezier(.3, 1.5, .55, 1) backwards; animation-delay: var(--d, 0s); }
  .csm.is-live .csm-dot  { animation: csm-pop .4s cubic-bezier(.3, 1.6, .55, 1) backwards; animation-delay: var(--d, 0s); }
  .csm.is-live .csm-label,
  .csm.is-live .csm-shadow { animation: csm-fade .3s ease backwards; animation-delay: calc(var(--d, 0s) + .3s); }
  @keyframes csm-drop { from { opacity: 0; transform: translateY(-36px); } 60% { opacity: 1; } }
  @keyframes csm-pop  { from { opacity: 0; transform: scale(0); } }
  @keyframes csm-fade { from { opacity: 0; } }

  /* ---- Hover card ---- */
  .csm-card {
    position: absolute;
    left: 0; top: 0;
    z-index: 1000;
    min-width: 150px;
    max-width: 240px;
    padding: 10px 14px 11px;
    border-radius: 10px;
    border-top: 3px solid var(--csm-yellow);
    background: #ffffff;
    box-shadow: 0 8px 24px rgba(20, 40, 79, .18), 0 1px 3px rgba(20, 40, 79, .12);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .16s ease, transform .16s ease;
  }
  .csm-card.is-on { opacity: 1; transform: translateY(0); }
  .csm-card::after {
    content: "";
    position: absolute;
    left: var(--nub, 50%);
    bottom: -6px;
    width: 12px; height: 12px;
    margin-left: -6px;
    background: #ffffff;
    transform: rotate(45deg);
    box-shadow: 3px 3px 4px rgba(20, 40, 79, .08);
  }
  .csm-card.is-below::after { bottom: auto; top: -8px; box-shadow: none; background: var(--csm-yellow); }
  .csm-card-eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--csm-muted);
  }
  .csm-card-name { display: block; margin-top: 1px; font-size: 16px; font-weight: 800; color: var(--csm-blue); }
  .csm-card-cta {
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--csm-blue);
    box-shadow: inset 0 -3px 0 var(--csm-yellow);
  }
  .csm-card-note { display: block; margin-top: 4px; font-size: 13px; color: var(--csm-muted); }


  @media (max-width: 600px) {
    .csm-map { border-radius: 10px; }
    .csm-label { font-size: 12px; }
    .csm-pin { width: 26px; height: 35px; }
    .csm-hq .csm-pin { width: 36px; height: 48px; }
    .csm-hq .csm-label { font-size: 11px; }
  }
  @media (max-width: 400px) {
    .csm-hq .csm-label { font-size: 10px; letter-spacing: .02em; padding: 2px 6px; }
    .csm-dotwrap .csm-label { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .csm *, .csm *::before, .csm *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="csm" id="chaplin-service-map">
  <div class="csm-stage">
    <div class="csm-map" id="csm-map" role="region" aria-label="Map of the Chaplin Screens service area"></div>
    <div class="csm-card" aria-hidden="true"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     EDIT HERE
     url: the suburb's service-area page. With a url the suburb gets a full
     pin and a link. Leave null and it shows as a small labelled dot until
     the page exists. Only https links are accepted.
     ===================================================================== */
  var HEAD_OFFICE = {
    name: 'Chaplin Screens',
    note: 'Our base, servicing Brisbane’s south, Logan and Ipswich',
    // Placed from the supplied map image. Swap in the exact address
    // coordinates (right-click the spot in Google Maps to copy them).
    lat: -27.672, lng: 153.015,
    url: null
  };

  var SUBURBS = [
    { name: 'Forest Lake',  lat: -27.6236, lng: 152.9681, url: null },
    { name: 'Springfield',  lat: -27.6650, lng: 152.9050, url: null },
    { name: 'White Rock',   lat: -27.6870, lng: 152.8620, url: null },
    { name: 'Greenbank',    lat: -27.7134, lng: 152.9830, url: null },
    { name: 'Park Ridge',   lat: -27.7087, lng: 153.0381, url: null },
    { name: 'Springwood',   lat: -27.6124, lng: 153.1293, url: null },
    { name: 'Beenleigh',    lat: -27.7155, lng: 153.2025, url: null },
    { name: 'Yarrabilba',   lat: -27.8100, lng: 153.1010, url: null },
    { name: 'Jimboomba',    lat: -27.8312, lng: 153.0275, url: 'https://www.chaplinscreens.com.au/jimboomba-security-screens/' },
    { name: 'Flagstone',    lat: -27.8090, lng: 152.9480, url: 'https://www.chaplinscreens.com.au/flagstone-security-screens/' }
  ];

  // Service-area boundary, traced from the dotted line on the supplied map.
  var SERVICE_AREA = [
    [-27.560, 152.930], [-27.555, 153.100], [-27.600, 153.255],
    [-27.760, 153.290], [-27.890, 153.215], [-27.935, 153.080],
    [-27.925, 152.930], [-27.840, 152.815], [-27.700, 152.790],
    [-27.620, 152.840]
  ];

  var BLUE = '#1d3970';
  var YELLOW = '#ffdc00';
  /* ===================================================================== */

  if (!window.L) return;
  var root = document.getElementById('chaplin-service-map');
  if (!root) return;
  var mapEl = root.querySelector('.csm-map');
  var cardEl = root.querySelector('.csm-card');
  if (mapEl._leaflet_id) return;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) {
    if (!u) return null;
    try {
      var parsed = new URL(u);
      return parsed.protocol === 'https:' ? parsed.href : null;
    } catch (e) { return null; }
  }
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---- Map: fixed in place. Hover and click only, so the page always
     scrolls normally and there are no gestures to learn. ---- */
  var map = L.map(mapEl, {
    zoomSnap: 0.25,
    dragging: false,
    touchZoom: false,
    doubleClickZoom: false,
    scrollWheelZoom: false,
    boxZoom: false,
    keyboard: false,
    tap: false,
    zoomControl: false,
    attributionControl: true
  });
  map.attributionControl.setPrefix(false);

  // Keyless Esri light grey basemap, without its own place labels.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri'
  }).addTo(map);

  L.polygon(SERVICE_AREA, {
    color: BLUE,
    weight: 1.5,
    opacity: 0.6,
    dashArray: '5 6',
    fillColor: BLUE,
    fillOpacity: 0.06,
    interactive: false
  }).addTo(map);

  // Frame the pins (not the whole boundary) so the suburbs get the room.
  var pinBounds = L.latLngBounds([[HEAD_OFFICE.lat, HEAD_OFFICE.lng]].concat(
    SUBURBS.map(function (s) { return [s.lat, s.lng]; })));
  function fitView() {
    var narrow = mapEl.clientWidth < 600;
    map.fitBounds(pinBounds, {
      paddingTopLeft: narrow ? [26, 46] : [80, 64],
      paddingBottomRight: narrow ? [26, 28] : [80, 44],
      animate: false
    });
  }
  fitView(); // must run before markers are added

  /* ---- Markers ---- */
  // Chaplin bowler hat, traced from the brand icon (200 x 160 box). The
  // "cut" strokes (brim gap and highlight) take the colour behind the hat.
  function hatPaths(fill, cut) {
    var brim = 'M26 96C80 98 140 116 182 140';
    return '<path d="M52 104C46 52 84 14 124 16C168 18 182 66 172 124C132 108 92 102 52 104Z" fill="' + fill + '"/>' +
      '<path d="M141 37C153 44 160 58 158 78" fill="none" stroke="' + cut + '" stroke-width="9" stroke-linecap="round"/>' +
      '<path d="' + brim + '" fill="none" stroke="' + cut + '" stroke-width="26" stroke-linecap="round"/>' +
      '<path d="' + brim + '" fill="none" stroke="' + fill + '" stroke-width="13" stroke-linecap="round"/>';
  }
  function hqPinSvg() {
    return '<svg viewBox="0 0 30 40" aria-hidden="true" focusable="false">' +
      '<path d="M15 1.5C7.5 1.5 1.5 7.4 1.5 14.8c0 9.6 11.2 21.6 12.6 23.1a1.3 1.3 0 0 0 1.8 0c1.4-1.5 12.6-13.5 12.6-23.1C28.5 7.4 22.5 1.5 15 1.5z" ' +
      'fill="' + YELLOW + '" stroke="' + BLUE + '" stroke-width="2"/>' +
      '<g transform="translate(5.6 7) scale(.095)">' + hatPaths(BLUE, YELLOW) + '</g></svg>';
  }
  var LABEL_HAT = '<svg class="csm-hat" viewBox="0 0 200 160" aria-hidden="true" focusable="false">' +
    hatPaths('currentColor', 'var(--csm-hat-cut)') + '</svg>';

  function pinSvg(fill, stroke, dot) {
    return '<svg viewBox="0 0 30 40" aria-hidden="true" focusable="false">' +
      '<path d="M15 1.5C7.5 1.5 1.5 7.4 1.5 14.8c0 9.6 11.2 21.6 12.6 23.1a1.3 1.3 0 0 0 1.8 0c1.4-1.5 12.6-13.5 12.6-23.1C28.5 7.4 22.5 1.5 15 1.5z" ' +
      'fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<circle cx="15" cy="14.5" r="5.2" fill="' + dot + '"/></svg>';
  }

  var entries = [];
  var lastPointerWasTouch = false;
  root.addEventListener('pointerdown', function (e) { lastPointerWasTouch = e.pointerType === 'touch'; }, true);

  function addMarker(item, kind) {
    var url = safeUrl(item.url);
    var hq = kind === 'hq';
    var full = hq || !!url;
    var tag = url ? 'a' : 'span';
    var attrs = url
      ? ' href="' + escapeHtml(url) + '" target="_top" aria-label="' + escapeHtml(item.name) + ' security screens"'
      : (hq ? ' tabindex="0" role="img" aria-label="' + escapeHtml(item.name) + ' head office"' : ' aria-hidden="true"');
    var inner = full
      ? '<span class="csm-pin">' + (hq ? hqPinSvg() : pinSvg(BLUE, '#ffffff', YELLOW)) + '</span>' +
        '<span class="csm-shadow"></span>' +
        '<span class="csm-label at-b">' + (hq ? LABEL_HAT : '') + escapeHtml(item.name) + '</span>'
      : '<span class="csm-dot"></span>' +
        '<span class="csm-label at-b">' + escapeHtml(item.name) + '</span>';
    var html = '<' + tag + ' class="csm-pinwrap' + (hq ? ' csm-hq' : '') + (full ? '' : ' csm-dotwrap') + '"' + attrs + '>' +
      inner + '</' + tag + '>';

    var baseZ = hq ? 600 : (url ? 300 : 0);
    var marker = L.marker([item.lat, item.lng], {
      icon: L.divIcon({ className: 'csm-marker', html: html, iconSize: null }),
      interactive: false,  // the element inside handles events natively
      keyboard: false,
      zIndexOffset: baseZ
    }).addTo(map);

    var wrap = marker.getElement().querySelector('.csm-pinwrap');
    var entry = {
      item: item, kind: kind, url: url, marker: marker, wrap: wrap,
      label: wrap.querySelector('.csm-label'),
      priority: hq ? 0 : (url ? 1 : 2),
      baseZ: baseZ
    };
    entries.push(entry);

    wrap.addEventListener('mouseenter', function () { if (!lastPointerWasTouch) setHot(entry, true); });
    wrap.addEventListener('mouseleave', function () { setHot(entry, false); });
    wrap.addEventListener('focus', function () { setHot(entry, true); });
    wrap.addEventListener('blur', function () { setHot(entry, false); });
    wrap.addEventListener('click', function (e) {
      if (!url) { flash(entry); return; }
      // Touch has no hover: show the card and hop, then go.
      if (!lastPointerWasTouch || reduceMotion || e.button !== 0) return;
      e.preventDefault();
      setHot(entry, true);
      setTimeout(function () { (window.top || window).location.href = url; }, 420);
    });
    return entry;
  }

  mapEl.setAttribute('aria-label', 'Map of the Chaplin Screens service area, covering ' +
    SUBURBS.map(function (s) { return s.name; }).join(', '));

  addMarker(HEAD_OFFICE, 'hq');
  SUBURBS.forEach(function (s) { addMarker(s, 'suburb'); });

  /* ---- Hot state: one place drives the marker and its card ---- */
  var hotEntry = null;
  var flashTimer;
  function setHot(entry, on) {
    if (on && hotEntry && hotEntry !== entry) setHot(hotEntry, false);
    entry.wrap.classList.toggle('is-hot', on);
    entry.marker.setZIndexOffset(on ? 3000 : entry.baseZ);
    if (on) { hotEntry = entry; showCard(entry); }
    else if (hotEntry === entry) { hotEntry = null; cardEl.classList.remove('is-on'); }
  }
  function flash(entry) {
    setHot(entry, true);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { setHot(entry, false); }, 2600);
  }

  function showCard(entry) {
    var item = entry.item;
    var body;
    if (entry.kind === 'hq') {
      body = '<span class="csm-card-eyebrow">Head office</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             (item.note ? '<span class="csm-card-note">' + escapeHtml(item.note) + '</span>' : '');
    } else if (entry.url) {
      body = '<span class="csm-card-eyebrow">Security screens</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             '<span class="csm-card-cta">View ' + escapeHtml(item.name) + ' &rarr;</span>';
    } else {
      body = '<span class="csm-card-eyebrow">We service</span>' +
             '<span class="csm-card-name">' + escapeHtml(item.name) + '</span>' +
             '<span class="csm-card-note">and surrounding suburbs</span>';
    }
    cardEl.innerHTML = body;
    cardEl.classList.remove('is-below');
    cardEl.classList.add('is-on');

    var isDot = entry.wrap.classList.contains('csm-dotwrap');
    var pt = map.latLngToContainerPoint([item.lat, item.lng]);
    var stageW = mapEl.clientWidth;
    var w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    var markHeight = isDot ? 10 : entry.wrap.querySelector('.csm-pin').offsetHeight + 8;
    var x = Math.max(8, Math.min(pt.x - w / 2, stageW - w - 8));
    var y = pt.y - markHeight - h - 10;
    if (y < 8) {
      // Not enough room above: open below the marker instead.
      y = pt.y + (isDot ? 14 : 30);
      cardEl.classList.add('is-below');
    }
    cardEl.style.left = x + 'px';
    cardEl.style.top = y + 'px';
    cardEl.style.setProperty('--nub', Math.max(14, Math.min(pt.x - x, w - 14)) + 'px');
  }

  /* ---- Label placement ----
     Suburb pin labels try below, right, left, then above; dot labels go
     below the dot, or above it if below is blocked. Each label takes
     the first spot clear of other pins, labels and the map edge.
     If none is clear it hides until its pin is hovered. */
  var SPOTS = ['at-b', 'at-r', 'at-l', 'at-t'];
  var DOT_SPOTS = ['at-b', 'at-t'];
  function overlaps(a, b, pad) {
    return !(a.right + pad <= b.left || b.right + pad <= a.left || a.bottom + pad <= b.top || b.bottom + pad <= a.top);
  }
  function layoutWith(hqSpot) {
    var frame = mapEl.getBoundingClientRect();
    var shown = 0;
    // Marker boxes (not the animated pin) so this works mid-animation.
    var taken = entries.map(function (e) { return { r: e.wrap.getBoundingClientRect(), owner: e }; });
    function fits(r, owner) {
      return r.left >= frame.left + 2 && r.right <= frame.right - 2 &&
             r.top >= frame.top + 2 && r.bottom <= frame.bottom - 16 &&
             !taken.some(function (t) { return t.owner !== owner && overlaps(r, t.r, 2); });
    }
    entries
      .filter(function (e) { return e.label; })
      .sort(function (a, b) { return a.priority - b.priority; })
      .forEach(function (e) {
        var spots = e.wrap.classList.contains('csm-dotwrap') ? DOT_SPOTS
          : (e.kind === 'hq' ? [hqSpot] : SPOTS);
        var placed = null;
        for (var i = 0; i < spots.length && !placed; i++) {
          SPOTS.forEach(function (c) { e.label.classList.remove(c); });
          e.label.classList.add(spots[i]);
          var r = e.label.getBoundingClientRect();
          if (fits(r, e)) placed = r;
        }
        if (!placed) {
          SPOTS.forEach(function (c) { e.label.classList.remove(c); });
          e.label.classList.add(spots[0]);
        }
        var keep = placed || e.priority === 0;
        e.label.classList.toggle('is-hidden', !keep);
        if (keep) taken.push({ r: placed || e.label.getBoundingClientRect(), owner: null });
        if (placed) shown++;
      });
    return shown;
  }
  // The head office label is placed first, so its side decides how much
  // room the suburbs around it get. Try each side and keep the one that
  // leaves the most labels on show (ties go to the earlier side).
  function placeLabels() {
    var best = SPOTS[0], bestShown = -1;
    SPOTS.forEach(function (spot) {
      var shown = layoutWith(spot);
      if (shown > bestShown) { best = spot; bestShown = shown; }
    });
    if (best !== SPOTS[SPOTS.length - 1]) layoutWith(best);
  }
  placeLabels();


  /* ---- Arrival animation: once, when the map scrolls into view ---- */
  if (!reduceMotion && 'IntersectionObserver' in window) {
    var hqLatLng = L.latLng(HEAD_OFFICE.lat, HEAD_OFFICE.lng);
    entries
      .slice()
      .sort(function (a, b) {
        return hqLatLng.distanceTo([a.item.lat, a.item.lng]) - hqLatLng.distanceTo([b.item.lat, b.item.lng]);
      })
      .forEach(function (e, i) { e.wrap.style.setProperty('--d', (i === 0 ? 0 : 0.2 + i * 0.07) + 's'); });
    root.classList.add('is-pending');
    var io = new IntersectionObserver(function (seen) {
      if (!seen[0].isIntersecting) return;
      io.disconnect();
      root.classList.remove('is-pending');
      root.classList.add('is-live');
    }, { threshold: 0.35 });
    io.observe(mapEl);
  }

  /* ---- Keep the framing right when the layout changes ---- */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (hotEntry) setHot(hotEntry, false);
      map.invalidateSize({ animate: false });
      fitView();
      placeLabels();
    }, 150);
  });
})();
</script>
