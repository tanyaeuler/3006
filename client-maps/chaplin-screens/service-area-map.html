<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaplin Screens Service Area</title>
<style>
  /* Standalone / iframe page only. Not needed when pasting the embed block. */
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
</style>
</head>
<body>

<!-- ================= CHAPLIN SCREENS MAP: EMBED START ================= -->
<!--
  To embed in WordPress: paste everything between EMBED START and EMBED END
  into a Custom HTML block. Or host this file and load it in an <iframe>.
  Links use target="_top", so they open in the full window either way.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  .csm {
    --csm-blue: #1d3970;
    --csm-yellow: #ffdc00;
    --csm-ink: #14284f;
    --csm-height: clamp(400px, 62vw, 620px);
    position: relative;
    width: 100%;
    font-family: inherit;
  }
  .csm *, .csm *::before, .csm *::after { box-sizing: border-box; }

  .csm-map {
    width: 100%;
    height: var(--csm-height);
    border-radius: 14px;
    overflow: hidden;
    background: #e8ecef;
    font: inherit;
    /* One finger scrolls the page; the map only takes pinch and two-finger
       gestures (see the touch handler below). Overrides Leaflet's
       touch-action: none, which is what traps the page on phones. */
    touch-action: pan-y !important;
  }
  .csm-map:focus-visible { outline: 3px solid var(--csm-yellow); outline-offset: 2px; }

  /* ---- Service-area boundary ---- */
  .csm-area { filter: drop-shadow(0 0 0 transparent); }

  /* ---- Markers ---- */
  .csm-marker { width: 0; height: 0; overflow: visible; }
  .csm-pinwrap {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    pointer-events: auto;
    cursor: default;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  a.csm-pinwrap { cursor: pointer; }
  .csm-pin {
    display: block;
    width: 30px; height: 40px;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .28));
  }
  .csm-pin svg { display: block; width: 100%; height: 100%; }
  .csm-shadow {
    position: absolute;
    left: 50%; top: 100%;
    width: 16px; height: 5px;
    margin: -3px 0 0 -8px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .25);
    pointer-events: none;
  }
  .csm-label {
    position: absolute;
    white-space: nowrap;
    padding: 3px 8px;
    border-radius: 6px;
    background: #ffffff;
    color: var(--csm-ink);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
    transition: opacity .2s ease, background-color .15s ease, color .15s ease;
  }
  .csm-label .csm-arrow {
    display: inline-block;
    width: 0; overflow: hidden;
    vertical-align: bottom;
    transition: width .15s ease;
  }
  /* Label sits below, right, left or above its pin, whichever is clear. */
  .csm-label.at-b { top: calc(100% + 4px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-t { bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); }
  .csm-label.at-r { left: calc(100% + 3px); top: 38%; transform: translateY(-50%); }
  .csm-label.at-l { right: calc(100% + 3px); top: 38%; transform: translateY(-50%); }
  /* Decluttered labels hide until the pin is hovered or focused. */
  .csm-label.is-hidden { opacity: 0; }

  a.csm-pinwrap:hover .csm-label,
  a.csm-pinwrap:focus-visible .csm-label {
    background: var(--csm-blue);
    color: var(--csm-yellow);
    opacity: 1;
  }
  a.csm-pinwrap:hover .csm-arrow,
  a.csm-pinwrap:focus-visible .csm-arrow { width: 1.1em; }
  .csm-pinwrap:hover .csm-label.is-hidden { opacity: 1; }
  a.csm-pinwrap:focus-visible .csm-pin svg path:first-child { stroke: var(--csm-yellow); stroke-width: 3; }

  /* Bounce while hovered or keyboard-focused. */
  .csm-pinwrap:hover .csm-pin,
  .csm-pinwrap:focus-visible .csm-pin,
  .csm-pinwrap.is-tapped .csm-pin { animation: csm-bounce .9s cubic-bezier(.3, 0, .3, 1) infinite; }
  .csm-pinwrap:hover .csm-shadow,
  .csm-pinwrap:focus-visible .csm-shadow,
  .csm-pinwrap.is-tapped .csm-shadow { animation: csm-shadow .9s cubic-bezier(.3, 0, .3, 1) infinite; }
  @keyframes csm-bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    12%      { transform: translateY(0) scale(1.08, .9); }
    40%      { transform: translateY(-16px) scale(.96, 1.05); }
    62%      { transform: translateY(0) scale(1.06, .93); }
    76%      { transform: translateY(-5px) scale(1, 1); }
    88%      { transform: translateY(0) scale(1, 1); }
  }
  @keyframes csm-shadow {
    0%, 100%, 62%, 88% { transform: scale(1); opacity: 1; }
    40%                { transform: scale(.55); opacity: .5; }
    76%                { transform: scale(.85); opacity: .8; }
  }

  /* Head office */
  .csm-hq .csm-pin { width: 38px; height: 50px; }
  .csm-hq .csm-label {
    background: var(--csm-yellow);
    color: var(--csm-blue);
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: 12px;
  }

  /* Secondary place names (no pin, not clickable) */
  .csm-place {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    color: var(--csm-blue);
    opacity: .75;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .csm-place.is-hidden { opacity: 0; }

  /* ---- Controls ---- */
  .csm .leaflet-bar a { color: var(--csm-blue); }
  .csm .leaflet-bar a:hover { background: #f3f5f9; }
  .csm .csm-reset svg { width: 16px; height: 16px; vertical-align: -3px; }
  .csm .leaflet-control-attribution { font-size: 10px; }

  /* ---- Gesture hint ---- */
  .csm-hint {
    position: absolute;
    left: 50%; bottom: 18px;
    transform: translate(-50%, 6px);
    z-index: 1000;
    max-width: calc(100% - 32px);
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(20, 40, 79, .92);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .csm-hint.is-on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    .csm-map { border-radius: 10px; }
    .csm-label { font-size: 12px; padding: 2px 6px; }
    .csm-pin { width: 26px; height: 35px; }
    .csm-hq .csm-pin { width: 32px; height: 42px; }
    .csm-hq .csm-label { font-size: 11px; }
    .csm-place { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .csm-pinwrap .csm-pin,
    .csm-pinwrap .csm-shadow { animation: none !important; }
    .csm-hint, .csm-label, .csm-place { transition: none; }
  }
</style>

<div class="csm" id="chaplin-service-map">
  <div class="csm-map" id="csm-map" role="region"
       aria-label="Map of the Chaplin Screens service area across Logan, Ipswich and the Scenic Rim"></div>
  <div class="csm-hint" aria-hidden="true"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     EDIT HERE
     url: the suburb's service-area page. Leave null and the pin shows
     but is not clickable. Only https links are accepted.
     ===================================================================== */
  var HEAD_OFFICE = {
    name: 'Chaplin Screens',
    // Placed from the supplied map image. Swap in the exact address
    // coordinates (right-click the spot in Google Maps to copy them).
    lat: -27.672, lng: 153.015,
    url: null
  };

  var SUBURBS = [
    { name: 'Forest Lake',  lat: -27.6236, lng: 152.9681, url: null },
    { name: 'Springfield',  lat: -27.6650, lng: 152.9050, url: null },
    { name: 'White Rock',   lat: -27.6870, lng: 152.8620, url: null },
    { name: 'Greenbank',    lat: -27.7134, lng: 152.9830, url: null },
    { name: 'Park Ridge',   lat: -27.7087, lng: 153.0381, url: null },
    { name: 'Springwood',   lat: -27.6124, lng: 153.1293, url: null },
    { name: 'Beenleigh',    lat: -27.7155, lng: 153.2025, url: null },
    { name: 'Yarrabilba',   lat: -27.8100, lng: 153.1010, url: null },
    { name: 'Jimboomba',    lat: -27.8312, lng: 153.0275, url: 'https://www.chaplinscreens.com.au/jimboomba-security-screens/' },
    { name: 'Flagstone',    lat: -27.8090, lng: 152.9480, url: 'https://www.chaplinscreens.com.au/flagstone-security-screens/' }
  ];

  // Area names from the brief that carry no pin.
  var PLACES = [
    { name: 'Sunnybank',      lat: -27.5795, lng: 153.0605 },
    { name: 'Redbank Plains', lat: -27.6460, lng: 152.8570 },
    { name: 'South Maclean',  lat: -27.7800, lng: 152.9950 },
    { name: 'Ormeau',         lat: -27.7680, lng: 153.2430 },
    { name: 'Woodhill',       lat: -27.8900, lng: 152.9800 },
    { name: 'Tamborine',      lat: -27.8820, lng: 153.1300 }
  ];

  // Service-area boundary, traced from the dotted line on the supplied map.
  var SERVICE_AREA = [
    [-27.560, 152.930], [-27.555, 153.100], [-27.600, 153.255],
    [-27.760, 153.290], [-27.890, 153.215], [-27.935, 153.080],
    [-27.925, 152.930], [-27.840, 152.815], [-27.700, 152.790],
    [-27.620, 152.840]
  ];

  var BLUE = '#1d3970';
  var YELLOW = '#ffdc00';
  /* ===================================================================== */

  if (!window.L) return;
  var root = document.getElementById('chaplin-service-map');
  var mapEl = document.getElementById('csm-map');
  var hintEl = root.querySelector('.csm-hint');
  if (!root || !mapEl || mapEl._leaflet_id) return;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) {
    if (!u) return null;
    try {
      var parsed = new URL(u);
      return parsed.protocol === 'https:' ? parsed.href : null;
    } catch (e) { return null; }
  }

  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

  var map = L.map(mapEl, {
    zoomSnap: 0.25,
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 90,
    scrollWheelZoom: true,   // Only ever reached by pinch / ctrl+scroll, see below.
    tap: false,
    attributionControl: true,
    zoomControl: true
  });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

  // Keyless Esri basemap: light grey base with labels on top.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    opacity: 0.9
  }).addTo(map);

  var area = L.polygon(SERVICE_AREA, {
    className: 'csm-area',
    color: BLUE,
    weight: 2,
    dashArray: '6 6',
    fillColor: BLUE,
    fillOpacity: 0.07,
    interactive: false
  }).addTo(map);

  /* ---- Initial view (must exist before markers are added) ---- */
  var userMoved = false;
  var fitting = false;
  // Frame the pins (not the whole boundary) so the suburbs get the room.
  // Padding leaves space for pin heads above and labels to the sides.
  var pinBounds = L.latLngBounds([[HEAD_OFFICE.lat, HEAD_OFFICE.lng]].concat(
    SUBURBS.map(function (s) { return [s.lat, s.lng]; })));
  function fitOptions() {
    var narrow = mapEl.clientWidth < 600;
    return {
      paddingTopLeft: narrow ? [34, 44] : [70, 56],
      paddingBottomRight: narrow ? [34, 30] : [70, 40]
    };
  }
  function fitArea() {
    map.fitBounds(pinBounds, L.extend({ animate: false }, fitOptions()));
    map.setMinZoom(Math.max(map.getZoom() - 1.5, 7));
  }
  fitArea();
  map.setMaxBounds(area.getBounds().pad(0.6));
  map.options.maxBoundsViscosity = 0.8;

  /* ---- Markers ---- */
  function pinSvg(fill, stroke, dot) {
    return '<svg viewBox="0 0 30 40" aria-hidden="true" focusable="false">' +
      '<path d="M15 1.5C7.5 1.5 1.5 7.4 1.5 14.8c0 9.6 11.2 21.6 12.6 23.1a1.3 1.3 0 0 0 1.8 0c1.4-1.5 12.6-13.5 12.6-23.1C28.5 7.4 22.5 1.5 15 1.5z" ' +
      'fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<circle cx="15" cy="14.5" r="5.2" fill="' + dot + '"/></svg>';
  }

  var labelled = []; // { el, priority } for decluttering

  function addPin(item, opts) {
    var url = safeUrl(item.url);
    var tag = url ? 'a' : 'span';
    var attrs = url
      ? ' href="' + escapeHtml(url) + '" target="_top" aria-label="' + escapeHtml(item.name) + ' security screens"'
      : ' aria-hidden="true"';
    var html =
      '<' + tag + ' class="csm-pinwrap' + (opts.hq ? ' csm-hq' : '') + '"' + attrs + '>' +
        '<span class="csm-pin">' + pinSvg(opts.fill, opts.stroke, opts.dot) + '</span>' +
        '<span class="csm-shadow"></span>' +
        '<span class="csm-label at-b">' + escapeHtml(item.name) +
          (url ? '<span class="csm-arrow" aria-hidden="true">&nbsp;&rarr;</span>' : '') +
        '</span>' +
      '</' + tag + '>';

    var marker = L.marker([item.lat, item.lng], {
      icon: L.divIcon({ className: 'csm-marker', html: html, iconSize: null }),
      interactive: false,  // the <a> inside handles clicks natively
      keyboard: false,
      zIndexOffset: opts.hq ? 500 : 0
    }).addTo(map);

    var el = marker.getElement();
    var wrap = el.querySelector('.csm-pinwrap');
    L.DomEvent.disableClickPropagation(wrap);

    // Lift the hovered pin (and its label) above its neighbours.
    var base = opts.hq ? 500 : 0;
    function lift() { marker.setZIndexOffset(2000); }
    function drop() { marker.setZIndexOffset(base); }
    wrap.addEventListener('mouseenter', lift);
    wrap.addEventListener('mouseleave', drop);
    wrap.addEventListener('focus', lift);
    wrap.addEventListener('blur', drop);

    // On touch there is no hover, so give a short bounce before the page changes.
    if (url) {
      wrap.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (!lastPointerWasTouch) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault();
        lift();
        wrap.classList.add('is-tapped');
        setTimeout(function () { (window.top || window).location.href = url; }, 380);
      });
    }

    labelled.push({ el: wrap.querySelector('.csm-label'), pin: wrap.querySelector('.csm-pin'), priority: opts.priority });
  }

  addPin(HEAD_OFFICE, { hq: true, fill: YELLOW, stroke: BLUE, dot: BLUE, priority: 0 });
  SUBURBS.forEach(function (s) {
    addPin(s, { fill: BLUE, stroke: '#ffffff', dot: YELLOW, priority: safeUrl(s.url) ? 1 : 2 });
  });
  PLACES.forEach(function (p) {
    var m = L.marker([p.lat, p.lng], {
      icon: L.divIcon({ className: 'csm-marker', html: '<span class="csm-place">' + escapeHtml(p.name) + '</span>', iconSize: null }),
      interactive: false,
      keyboard: false,
      zIndexOffset: -500
    }).addTo(map);
    labelled.push({ el: m.getElement().querySelector('.csm-place'), pin: null, priority: 3 });
  });

  /* ---- Label placement ----
     Suburbs in the north sit only a few km apart, so labels would collide.
     In priority order (head office, linked suburbs, other suburbs, place
     names) each label tries below, right, left, then above its pin and
     takes the first spot that is clear and inside the map. If none is,
     it hides until hovered/focused or the map is zoomed in. Pins always
     stay visible. */
  var SPOTS = ['at-b', 'at-r', 'at-l', 'at-t'];
  function overlaps(a, b, pad) {
    return !(a.right + pad <= b.left || b.right + pad <= a.left || a.bottom + pad <= b.top || b.bottom + pad <= a.top);
  }
  function declutter() {
    var frame = mapEl.getBoundingClientRect();
    var taken = [];
    labelled.forEach(function (l) { if (l.pin) taken.push(l.pin.getBoundingClientRect()); });
    function fits(r) {
      return r.left >= frame.left + 2 && r.right <= frame.right - 2 &&
             r.top >= frame.top + 2 && r.bottom <= frame.bottom - 16 &&
             !taken.some(function (t) { return overlaps(r, t, 2); });
    }
    labelled
      .slice()
      .sort(function (a, b) { return a.priority - b.priority; })
      .forEach(function (l) {
        var spots = l.pin ? SPOTS : [null];
        var placed = null;
        for (var i = 0; i < spots.length && !placed; i++) {
          if (spots[i]) {
            SPOTS.forEach(function (c) { l.el.classList.remove(c); });
            l.el.classList.add(spots[i]);
          }
          var r = l.el.getBoundingClientRect();
          if (fits(r)) placed = r;
        }
        if (!placed && l.pin) {
          SPOTS.forEach(function (c) { l.el.classList.remove(c); });
          l.el.classList.add('at-b');
        }
        var keep = placed || l.priority === 0;
        l.el.classList.toggle('is-hidden', !keep);
        if (keep) taken.push(placed || l.el.getBoundingClientRect());
      });
  }

  declutter();
  map.on('zoomend', declutter);
  map.on('dragstart', function () { userMoved = true; });
  map.on('zoomstart', function () { if (!fitting) userMoved = true; });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      map.invalidateSize({ animate: false });
      if (!userMoved) { fitting = true; fitArea(); fitting = false; }
      declutter();
    }, 150);
  });

  // Reset-view button under the zoom buttons.
  var Reset = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      var bar = L.DomUtil.create('div', 'leaflet-bar');
      var a = L.DomUtil.create('a', 'csm-reset', bar);
      a.href = '#';
      a.title = 'Show the whole service area';
      a.setAttribute('role', 'button');
      a.setAttribute('aria-label', 'Show the whole service area');
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
      L.DomEvent.disableClickPropagation(bar);
      L.DomEvent.on(a, 'click', function (e) {
        L.DomEvent.preventDefault(e);
        fitting = true;
        map.flyToBounds(pinBounds, L.extend({ duration: 0.6 }, fitOptions()));
        map.once('moveend', function () { fitting = false; userMoved = false; });
      });
      return bar;
    }
  });
  map.addControl(new Reset());

  /* ---- Gesture hint ---- */
  var hintTimer;
  function hint(text) {
    hintEl.textContent = text;
    hintEl.classList.add('is-on');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hintEl.classList.remove('is-on'); }, 1600);
  }

  /* ---- Scroll trap fix: trackpad / mouse wheel ----
     A two-finger trackpad swipe arrives as a plain wheel event. Stop those
     before Leaflet sees them, without preventDefault, so the page scrolls
     normally. Pinch arrives as wheel + ctrlKey and still reaches Leaflet,
     as does ctrl/cmd + scroll. */
  var wheelHintShown = false;
  root.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) return;
    e.stopPropagation();
    if (!wheelHintShown) {
      wheelHintShown = true;
      hint(isMac ? 'Pinch or ⌘ + scroll to zoom the map' : 'Ctrl + scroll to zoom the map');
    }
  }, { capture: true, passive: true });
  root.addEventListener('mouseleave', function () { wheelHintShown = false; });

  // Desktop Safari reports trackpad pinch as gesture events, not ctrl+wheel.
  // Without this, pinching the map would zoom the whole web page there.
  if (typeof window.GestureEvent !== 'undefined' && !navigator.maxTouchPoints) {
    var gestureStartZoom = null;
    mapEl.addEventListener('gesturestart', function (e) {
      e.preventDefault();
      gestureStartZoom = map.getZoom();
    });
    mapEl.addEventListener('gesturechange', function (e) {
      e.preventDefault();
      if (gestureStartZoom === null) return;
      var pt = map.mouseEventToContainerPoint(e);
      map.setZoomAround(pt, gestureStartZoom + Math.log2(e.scale), { animate: false });
    });
    mapEl.addEventListener('gestureend', function (e) {
      e.preventDefault();
      gestureStartZoom = null;
    });
  }

  /* ---- Scroll trap fix: phones and tablets ----
     A single finger is the page's: block it from reaching Leaflet's drag
     handler (no preventDefault, so the browser scrolls). Two fingers still
     reach Leaflet's pinch handler, which also pans. Taps and double-taps
     are unaffected because they arrive as click / dblclick events. */
  var lastPointerWasTouch = false;
  var oneFingerStart = null;
  root.addEventListener('pointerdown', function (e) { lastPointerWasTouch = e.pointerType === 'touch'; }, true);
  root.addEventListener('touchstart', function (e) {
    lastPointerWasTouch = true;
    if (e.touches.length === 1) {
      oneFingerStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      e.stopPropagation();
    } else {
      oneFingerStart = null;
    }
  }, { capture: true, passive: true });
  root.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 1 || !oneFingerStart) return;
    var dx = Math.abs(e.touches[0].clientX - oneFingerStart.x);
    var dy = Math.abs(e.touches[0].clientY - oneFingerStart.y);
    // Mostly sideways swipes look like an attempt to pan the map.
    if (dx > 24 && dx > dy) { oneFingerStart = null; hint('Use two fingers to move the map'); }
  }, { capture: true, passive: true });
})();
</script>
