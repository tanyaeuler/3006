<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Inspection Coverage Across Australia</title>
<meta name="description" content="Interactive map of inspected bridge, culvert and structure assets across Australia, colour coded by project.">
<!-- Leaflet 1.9.4, served from alongside this file rather than a CDN. Keep
     leaflet.css, leaflet.js and images/ next to the page when moving it. -->
<link rel="stylesheet" href="leaflet.css">
<style>
  :root {
    --ink: #0E1B39;
    --ink-soft: #5A6685;
    --line: #E3E7F0;
    --panel: #FFFFFF;
    --shadow: 0 10px 34px rgba(14, 27, 57, .14);
    --radius: 14px;
    --corridor: #F5A623;
    --panel-width: 336px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    color: var(--ink);
    background: #F4F6FA;
    -webkit-text-size-adjust: 100%;
  }

  #map { position: absolute; inset: 0; background: #F4F6FA; }
  .leaflet-container { font: inherit; background: #F4F6FA; }

  /* ---------- Title ---------- */

  .title {
    position: absolute;
    top: 20px;
    left: 24px;
    z-index: 500;
    max-width: min(420px, calc(100% - 48px));
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 34px);
    line-height: 1.14;
    letter-spacing: -.02em;
    font-weight: 800;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 0 18px rgba(255, 255, 255, .85);
  }
  .title p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 0 14px rgba(255, 255, 255, .85);
  }

  /* ---------- Panel ---------- */

  .panel {
    position: absolute;
    z-index: 600;
    left: 24px;
    bottom: 28px;
    width: var(--panel-width);
    max-height: min(64vh, 620px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 16px 18px 10px;
  }
  .panel-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .panel-head .tally { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .scroller { overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px; }

  .legend { list-style: none; margin: 0; padding: 0 10px; }
  .legend li { border-radius: 9px; }
  .legend li + li { margin-top: 1px; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 7px 8px;
    border: 0;
    background: none;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .row:hover { background: #F2F5FB; }
  .row .dot { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(14, 27, 57, .1); }
  .row .label { font-size: 13.5px; font-weight: 600; flex: 1 1 auto; line-height: 1.3; }
  .row .label .note { font-weight: 500; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .row .n { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .row.off { opacity: .42; }
  .row.off .dot { background: #C6CEDF !important; }

  .row .zoom {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border: 0; border-radius: 6px; padding: 0;
    background: none; color: var(--ink-soft);
    cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .row:hover .zoom, .row .zoom:focus-visible { opacity: 1; }
  .row .zoom:hover { background: #E4EAF6; color: var(--ink); }
  .row .zoom svg { width: 13px; height: 13px; }

  .corridor-row { padding: 4px 18px 0; margin-top: 6px; border-top: 1px solid var(--line); }
  .corridor-row .row { padding-left: 0; padding-right: 0; }
  .corridor-row .row:hover { background: none; }
  .corridor-row .dash {
    width: 24px; height: 0; flex: 0 0 auto; margin-right: -1px;
    border-top: 3px dashed var(--corridor); border-radius: 2px;
  }
  .corridor-row .label { font-weight: 500; font-size: 12.5px; color: var(--ink-soft); }

  .panel-foot {
    display: flex;
    gap: 8px;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--line);
  }
  .panel-foot button {
    flex: 1;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 4px;
    color: var(--ink-soft);
    background: #F6F8FC;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .panel-foot button:hover { background: #ECF1FA; color: var(--ink); }

  /* ---------- Popups ---------- */

  .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: var(--shadow); }
  .leaflet-popup-content { margin: 13px 15px; font-size: 13px; line-height: 1.45; min-width: 180px; }
  .pop-name { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .pop-name i { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .pop-coords { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 12px; }
  .pop-note { margin-top: 7px; padding: 6px 8px; border-radius: 7px; background: #FFF6E5; color: #7A5310; font-size: 11.5px; line-height: 1.4; }
  .pop-links { margin-top: 9px; display: flex; gap: 12px; }
  .pop-links a, .pop-links button {
    font: inherit; font-size: 12px; font-weight: 600;
    color: #1B6DE0; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none;
  }
  .pop-links a:hover, .pop-links button:hover { text-decoration: underline; }

  .leaflet-tooltip.asset-tip {
    background: rgba(14, 27, 57, .92);
    border: 0;
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 8px;
    box-shadow: none;
    border-radius: 6px;
  }
  .leaflet-tooltip.asset-tip::before { display: none; }

  /* ---------- Map controls ---------- */

  .leaflet-bar a, .leaflet-bar a:hover { color: var(--ink); border-bottom-color: var(--line); }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255, 255, 255, .82); }

  .basemap {
    background: var(--panel);
    border: 1px solid var(--line) !important;
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 4px;
    display: flex;
    gap: 2px;
  }
  .basemap button {
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 10px; border: 0; border-radius: 7px;
    background: none; color: var(--ink-soft); cursor: pointer;
  }
  .basemap button.on { background: #EDF2FC; color: var(--ink); }

  .panel-toggle {
    position: absolute;
    z-index: 600;
    left: 24px;
    bottom: 28px;
    display: none;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    color: var(--ink);
    cursor: pointer;
  }

  /* ---------- Small screens ---------- */

  @media (max-width: 760px) {
    .title { top: 14px; left: 16px; }
    .title p { display: none; }
    .panel {
      left: 12px;
      right: 12px;
      bottom: 12px;
      width: auto;
      max-height: min(58vh, 460px);
    }
    .panel[hidden] { display: none; }
    .panel-toggle { display: flex; left: 12px; bottom: 12px; }
    .panel-toggle[hidden] { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of inspected assets across Australia"></div>

<div class="title">
  <h1>Asset Inspection<br>Coverage Across Australia</h1>
  <p id="subtitle"></p>
</div>

<button class="panel-toggle" id="panelToggle" hidden aria-expanded="true" aria-controls="panel">
  <span>Projects</span>
</button>

<aside class="panel" id="panel" aria-label="Project filters">
  <div class="panel-head">
    <h2>Projects</h2>
    <span class="tally" id="tally"></span>
  </div>

  <div class="scroller" id="scroller">
    <ul class="legend" id="legend"></ul>
  </div>

  <div class="corridor-row" id="corridorRow">
    <button class="row" id="corridorToggle" aria-pressed="true">
      <span class="dash"></span>
      <span class="label">ARTC corridor (approx. 200+ structures)</span>
    </button>
  </div>

  <div class="panel-foot">
    <button id="selectAll" type="button">Select all</button>
    <button id="clearAll" type="button">Clear all</button>
    <button id="resetView" type="button">Reset view</button>
  </div>
</aside>

/* MAP-DATA:END */

/* Headline coverage figure. The plotted markers are inspection sites, not one
   marker per structure, so this total is set editorially rather than counted
   from the data. */
const TOTAL_LABEL = '3,500+';

const AUSTRALIA = L.latLngBounds([-44.2, 112.0], [-9.5, 154.5]);

/* ------------------------------------------------------------------ *
 * Map + basemaps
 * ------------------------------------------------------------------ */

const map = L.map('map', {
  zoomControl: false,
  attributionControl: true,
  minZoom: 3,
  maxZoom: 18,
  /* Fractional snapping lets fitBounds fill the viewport properly on wide
     screens; the zoom buttons still step by whole levels. */
  zoomSnap: .25,
  zoomDelta: 1,
  worldCopyJump: false,
  maxBounds: L.latLngBounds([-60, 90], [5, 180]),
  maxBoundsViscosity: .6
});

const basemaps = {
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
    maxZoom: 18
  })
};

let activeBasemap = 'light';
basemaps.light.addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);
L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);

const BasemapControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const box = L.DomUtil.create('div', 'basemap leaflet-bar');
    box.innerHTML =
      '<button type="button" data-key="light" class="on">Map</button>' +
      '<button type="button" data-key="satellite">Satellite</button>';
    L.DomEvent.disableClickPropagation(box);
    box.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || button.dataset.key === activeBasemap) return;
      map.removeLayer(basemaps[activeBasemap]);
      activeBasemap = button.dataset.key;
      basemaps[activeBasemap].addTo(map).bringToBack();
      box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === button));
      writeHash();
    });
    return box;
  }
});
map.addControl(new BasemapControl());

/* ------------------------------------------------------------------ *
 * Corridor overlay
 * ------------------------------------------------------------------ */

/* Each sheet of the ARTC workbook is one continuous run of line, drawn as its
   own polyline. Keeping them separate is what leaves the Sydney–Newcastle gap
   open, where there is no ARTC line to follow. */
const corridorColour = getComputedStyle(document.documentElement)
  .getPropertyValue('--corridor').trim() || '#F5A623';

const corridorLayer = L.layerGroup(
  CORRIDORS.map(segment => L.polyline(segment.points, {
    color: corridorColour,
    weight: 4,
    opacity: .95,
    dashArray: '12 10',
    lineCap: 'round',
    lineJoin: 'round',
    interactive: true
  }).bindTooltip('ARTC corridor', { sticky: true, className: 'asset-tip' }))
).addTo(map);

/* ------------------------------------------------------------------ *
 * Markers
 * ------------------------------------------------------------------ */

const markerLayer = L.layerGroup().addTo(map);
const projectState = new Map();   // project name -> { colour, visible, markers, bounds }

/* Several assets share an identical coordinate (a bridge and its viewing
   platform, for instance). Fan duplicates out onto a small ring so every
   marker stays individually clickable at high zoom. */
function fanOutDuplicates(assets) {
  const buckets = new Map();
  assets.forEach(asset => {
    const key = asset.lat.toFixed(5) + ',' + asset.lng.toFixed(5);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(asset);
  });
  buckets.forEach(group => {
    if (group.length < 2) return;
    const radius = 0.00025; // ~28 m
    group.forEach((asset, index) => {
      const angle = (2 * Math.PI * index) / group.length;
      asset.dLat = asset.lat + radius * Math.cos(angle);
      asset.dLng = asset.lng + radius * Math.sin(angle) / Math.cos(asset.lat * Math.PI / 180);
      asset.stacked = group.length;
    });
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/* Points are identified by their project, never by the individual asset name. */
function popupHtml(asset) {
  const coords = asset.lat.toFixed(6) + ', ' + asset.lng.toFixed(6);
  return (
    '<div class="pop-name"><i style="background:' + asset.colour + '"></i>' + escapeHtml(asset.project) + '</div>' +
    '<div class="pop-coords">' + coords + '</div>' +
    (asset.note ? '<div class="pop-note">' + escapeHtml(asset.note) + '</div>' : '') +
    '<div class="pop-links">' +
      '<a href="https://www.google.com/maps/search/?api=1&query=' + asset.lat + ',' + asset.lng + '" target="_blank" rel="noopener">Open in Google Maps</a>' +
      '<button type="button" data-copy="' + coords + '">Copy coordinates</button>' +
    '</div>'
  );
}

function radiusForZoom(zoom) {
  if (zoom <= 4) return 5;
  if (zoom <= 6) return 6;
  if (zoom <= 9) return 7;
  return 8;
}

PROJECTS.forEach(project => {
  fanOutDuplicates(project.assets);

  const markers = project.assets.map(raw => {
    const asset = Object.assign({}, raw, { project: project.name, colour: project.colour });
    const marker = L.circleMarker([asset.dLat ?? asset.lat, asset.dLng ?? asset.lng], {
      radius: radiusForZoom(map.getZoom() || 4),
      color: '#ffffff',
      weight: 1.6,
      opacity: 1,
      fillColor: project.colour,
      fillOpacity: 1,
      bubblingMouseEvents: false
    });
    marker.bindTooltip(project.name, { direction: 'top', offset: [0, -6], className: 'asset-tip' });
    marker.bindPopup(() => popupHtml(asset), { closeButton: true, autoPanPadding: [30, 30] });
    marker.on('mouseover', () => marker.setStyle({ weight: 3 }));
    marker.on('mouseout', () => marker.setStyle({ weight: 1.6 }));

    return marker;
  });

  markers.forEach(marker => markerLayer.addLayer(marker));

  projectState.set(project.name, {
    colour: project.colour,
    visible: true,
    markers,
    count: project.assets.length,
    note: project.note || '',
    bounds: L.latLngBounds(project.assets.map(a => [a.dLat ?? a.lat, a.dLng ?? a.lng]))
  });
});

map.on('zoomend', () => {
  const radius = radiusForZoom(map.getZoom());
  markerLayer.eachLayer(marker => marker.setRadius(radius));
});

document.addEventListener('click', event => {
  const button = event.target.closest('.pop-links button[data-copy]');
  if (!button) return;
  const done = () => { button.textContent = 'Copied'; setTimeout(() => { button.textContent = 'Copy coordinates'; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(button.dataset.copy).then(done, () => {});
  else done();
});

/* ------------------------------------------------------------------ *
 * Legend + filtering
 * ------------------------------------------------------------------ */

const legendEl = document.getElementById('legend');
const tallyEl = document.getElementById('tally');
const subtitleEl = document.getElementById('subtitle');
const projectCount = projectState.size;

subtitleEl.textContent = TOTAL_LABEL + ' inspected assets across ' + projectCount + ' projects';

projectState.forEach((state, name) => {
  const li = document.createElement('li');
  /* Projects that stand for many more structures than they have markers show
     that note instead of a marker count. */
  li.innerHTML =
    '<button class="row" type="button" aria-pressed="true" data-project="' + escapeHtml(name) + '">' +
      '<span class="dot" style="background:' + state.colour + '"></span>' +
      '<span class="label">' + escapeHtml(name) +
        (state.note ? ' <span class="note">(' + escapeHtml(state.note) + ')</span>' : '') +
      '</span>' +
      (state.note ? '' : '<span class="n">' + state.count + '</span>') +
      '<span class="zoom" role="button" tabindex="0" aria-label="Zoom to ' + escapeHtml(name) + '" title="Zoom to project">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">' +
        '<circle cx="7" cy="7" r="4.6"></circle><path d="M10.4 10.4 14 14" stroke-linecap="round"></path>' +
        '<path d="M5 7h4M7 5v4" stroke-linecap="round"></path></svg>' +
      '</span>' +
    '</button>';
  legendEl.appendChild(li);
});

function applyVisibility() {
  projectState.forEach((state) => {
    state.markers.forEach(marker => {
      const on = markerLayer.hasLayer(marker);
      if (state.visible && !on) markerLayer.addLayer(marker);
      if (!state.visible && on) markerLayer.removeLayer(marker);
    });
  });

  /* The headline figure counts structures, while filtering works on projects,
     so the tally switches units rather than mixing the two. */
  let shownProjects = 0;
  projectState.forEach(state => { if (state.visible) shownProjects += 1; });
  tallyEl.textContent = shownProjects === projectCount
    ? TOTAL_LABEL + ' assets'
    : shownProjects + ' of ' + projectCount + ' projects';

  legendEl.querySelectorAll('.row').forEach(row => {
    const state = projectState.get(row.dataset.project);
    row.classList.toggle('off', !state.visible);
    row.setAttribute('aria-pressed', String(state.visible));
  });

  writeHash();
}

/* Keep fitted content clear of the title and the projects panel, both of which
   float over the map. */
function fitPadding() {
  if (window.matchMedia('(max-width: 760px)').matches) {
    const sheet = panel.hidden ? 0 : Math.min(panel.offsetHeight, window.innerHeight * .6);
    return { paddingTopLeft: [24, 92], paddingBottomRight: [24, sheet + 30] };
  }
  return { paddingTopLeft: [panel.offsetWidth + 48, 116], paddingBottomRight: [72, 64] };
}

function zoomToProject(name) {
  const state = projectState.get(name);
  if (!state) return;
  if (!state.visible) { state.visible = true; applyVisibility(); }

  let bounds = state.bounds;
  if (bounds.getNorth() === bounds.getSouth() && bounds.getEast() === bounds.getWest()) {
    const centre = bounds.getCenter();
    bounds = L.latLngBounds(
      [centre.lat - .004, centre.lng - .004],
      [centre.lat + .004, centre.lng + .004]
    );
  }
  map.flyToBounds(bounds, Object.assign({ maxZoom: 15, duration: .7 }, fitPadding()));
}

legendEl.addEventListener('click', event => {
  const zoom = event.target.closest('.zoom');
  const row = event.target.closest('.row');
  if (!row) return;
  if (zoom) {
    event.preventDefault();
    zoomToProject(row.dataset.project);
    return;
  }
  const state = projectState.get(row.dataset.project);
  state.visible = !state.visible;
  applyVisibility();
});

legendEl.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const zoom = event.target.closest('.zoom');
  if (!zoom) return;
  event.preventDefault();
  event.stopPropagation();
  zoomToProject(zoom.closest('.row').dataset.project);
});

document.getElementById('selectAll').addEventListener('click', () => {
  projectState.forEach(state => { state.visible = true; });
  applyVisibility();
});

document.getElementById('clearAll').addEventListener('click', () => {
  projectState.forEach(state => { state.visible = false; });
  applyVisibility();
});

document.getElementById('resetView').addEventListener('click', () => {
  map.flyToBounds(AUSTRALIA, Object.assign({ duration: .7 }, fitPadding()));
});

const corridorToggle = document.getElementById('corridorToggle');
corridorToggle.addEventListener('click', () => {
  const on = !map.hasLayer(corridorLayer);
  if (on) corridorLayer.addTo(map); else map.removeLayer(corridorLayer);
  corridorToggle.setAttribute('aria-pressed', String(on));
  corridorToggle.classList.toggle('off', !on);
  writeHash();
});

/* ------------------------------------------------------------------ *
 * Collapsible panel (small screens)
 * ------------------------------------------------------------------ */

const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');

function setPanel(open) {
  panel.hidden = !open;
  panelToggle.hidden = open;
  panelToggle.setAttribute('aria-expanded', String(open));
}

panelToggle.addEventListener('click', () => setPanel(true));

const small = window.matchMedia('(max-width: 760px)');
function syncPanel() {
  if (small.matches) setPanel(false);
  else { panel.hidden = false; panelToggle.hidden = true; }
}
small.addEventListener('change', syncPanel);

/* Tapping the map on a phone dismisses the sheet so the markers are visible. */
map.on('click', () => { if (small.matches) setPanel(false); });

/* ------------------------------------------------------------------ *
 * Shareable view state in the URL hash
 * ------------------------------------------------------------------ */

let hashTimer = null;
function writeHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const centre = map.getCenter();
    const hidden = [];
    projectState.forEach((state, name) => { if (!state.visible) hidden.push(name); });
    const parts = [
      centre.lat.toFixed(4) + ',' + centre.lng.toFixed(4) + ',' + map.getZoom(),
      activeBasemap === 'light' ? '' : 'b=' + activeBasemap,
      map.hasLayer(corridorLayer) ? '' : 'c=0',
      hidden.length ? 'off=' + encodeURIComponent(hidden.join('|')) : ''
    ].filter(Boolean);
    history.replaceState(null, '', '#' + parts.join('&'));
  }, 250);
}

function readHash() {
  const hash = location.hash.replace(/^#/, '');
  if (!hash) return false;
  const parts = hash.split('&');
  const view = parts[0].split(',').map(Number);

  parts.slice(1).forEach(part => {
    const [key, value] = part.split('=');
    if (key === 'b' && basemaps[value]) {
      map.removeLayer(basemaps[activeBasemap]);
      activeBasemap = value;
      basemaps[activeBasemap].addTo(map).bringToBack();
      document.querySelectorAll('.basemap button').forEach(b => b.classList.toggle('on', b.dataset.key === value));
    }
    if (key === 'c' && value === '0') {
      map.removeLayer(corridorLayer);
      corridorToggle.setAttribute('aria-pressed', 'false');
      corridorToggle.classList.add('off');
    }
    if (key === 'off') {
      decodeURIComponent(value).split('|').forEach(name => {
        const state = projectState.get(name);
        if (state) state.visible = false;
      });
    }
  });

  if (view.length === 3 && view.every(Number.isFinite)) {
    map.setView([view[0], view[1]], view[2]);
    return true;
  }
  return false;
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */

syncPanel();
const restored = readHash();
if (!restored) map.fitBounds(AUSTRALIA, fitPadding());
applyVisibility();
map.on('moveend zoomend', writeHash);
</script>
